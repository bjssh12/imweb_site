<!-- ===================================================================
     돈보라 메인 롤링 배너
     이 파일 전체를 복사해서 아임웹 > 코드(HTML) 위젯에 붙여넣으세요.

     · 이 파일 하나에 HTML · CSS · JavaScript · jQuery가 모두 들어 있습니다.
     · 이미지는 전부 절대경로(https:// 전체 주소)로 넣습니다.
     · 폰트는 Pretendard.
     · 수정은 아래 "① 여기만 수정" 부분만 건드리면 됩니다.
     =================================================================== -->

<!-- Pretendard 웹폰트 -->
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />

<div class="dbr-banner" id="dbrBanner">
  <div class="dbr-viewport">
    <div class="dbr-track" id="dbrTrack"></div>
  </div>
  <button class="dbr-arrow dbr-arrow--prev" type="button" aria-label="이전 배너">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" /></svg>
  </button>
  <button class="dbr-arrow dbr-arrow--next" type="button" aria-label="다음 배너">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" /></svg>
  </button>
  <div class="dbr-dots" id="dbrDots" aria-label="배너 선택"></div>
</div>


<!-- ============================ CSS ============================ -->
<style>
#dbrBanner {
  /* 이미지 로드 전 임시 비율. 로드되면 실제 이미지 비율로 자동 교체됩니다. */
  --dbr-ratio: 1920 / 460;
  --dbr-radius: 0px;      /* 모서리를 둥글게 하려면 예: 12px */
  --dbr-maxwidth: none;   /* 배너 최대 폭을 제한하려면 예: 1920px */

  position: relative;
  width: 100%;
  max-width: var(--dbr-maxwidth);
  margin: 0 auto;
  overflow: hidden;
  border-radius: var(--dbr-radius);

  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
               system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo',
               'Noto Sans KR', 'Malgun Gothic', sans-serif;
  word-break: keep-all;
}
#dbrBanner * { box-sizing: border-box; font-family: inherit; }

#dbrBanner .dbr-viewport {
  position: relative; width: 100%;
  aspect-ratio: var(--dbr-ratio);
  overflow: hidden; background: #f1f3f5;
}
#dbrBanner .dbr-track { display: flex; width: 100%; height: 100%; will-change: transform; }
#dbrBanner .dbr-slide {
  flex: 0 0 100%; width: 100%; height: 100%;
  display: block; position: relative; overflow: hidden;
  text-decoration: none; -webkit-tap-highlight-color: transparent;
}
#dbrBanner .dbr-slide picture { display: block; width: 100%; height: 100%; }
#dbrBanner .dbr-slide img {
  width: 100%; height: 100%; object-fit: cover; object-position: center;
  display: block; user-select: none; -webkit-user-drag: none;
}

/* 이미지를 아직 못 불러왔을 때 보이는 자리표시 */
#dbrBanner .dbr-placeholder {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px;
  background: repeating-linear-gradient(45deg, #d0d7dd 0 14px, #c2cad2 14px 28px);
  color: #2b3440; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;
}

/* 좌우 화살표 — 마우스가 있는 큰 화면에서만 노출 */
#dbrBanner .dbr-arrow {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(0, 0, 0, 0.32);
  display: none; align-items: center; justify-content: center;
  opacity: 0; transition: opacity .2s ease, background .2s ease; z-index: 2;
}
#dbrBanner:hover .dbr-arrow, #dbrBanner .dbr-arrow:focus-visible { opacity: 1; }
#dbrBanner .dbr-arrow:hover { background: rgba(0, 0, 0, 0.55); }
#dbrBanner .dbr-arrow--prev { left: 16px; }
#dbrBanner .dbr-arrow--next { right: 16px; }
#dbrBanner .dbr-arrow svg {
  width: 22px; height: 22px; fill: none; stroke: #fff;
  stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;
}
@media (min-width: 1024px) and (hover: hover) {
  #dbrBanner .dbr-arrow { display: flex; }
}

/* 하단 도트 */
#dbrBanner .dbr-dots {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; z-index: 2;
  padding: 8px 12px; border-radius: 999px; background: rgba(0, 0, 0, 0.28);
}
#dbrBanner .dbr-dot {
  width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;
  background: rgba(255, 255, 255, 0.5); transition: background .2s ease, width .2s ease;
}
#dbrBanner .dbr-dot.is-active { width: 20px; border-radius: 999px; background: #fff; }

@media (max-width: 767px) {
  #dbrBanner .dbr-dots { bottom: 12px; padding: 6px 10px; gap: 6px; }
}
@media (prefers-reduced-motion: reduce) {
  #dbrBanner .dbr-track { transition: none !important; }
}
</style>


<!-- ======================= jQuery + JavaScript ======================= -->
<script>
(function () {
  /* ===============================================================
     ① 여기만 수정하세요

     pc     : 데스크탑용(가로형) 이미지 주소 — https:// 전체 주소(절대경로)
     mo     : 모바일용(세로형) 이미지 주소 — https:// 전체 주소(절대경로)
     link   : 배너를 눌렀을 때 이동할 주소 ('' 로 두면 클릭 안 되는 배너)
     alt    : 이미지 설명 (검색 노출·접근성용)
     newTab : true면 새 창으로 열림
     =============================================================== */
  var BANNERS = [
    {
      pc:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner1_pc.png',
      mo:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner1_mo.png',
      link: '',
      alt:  '갈아타기 할 때까지 — 돈보라멤버십',
      newTab: false
    },
    {
      pc:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner2_pc.png',
      mo:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner2_mo.png',
      link: '',
      alt:  '매수를 위한 진짜 상담, 돈보라 풀케어',
      newTab: false
    },
    {
      pc:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner3_pc.png',
      mo:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner3_mo.png',
      link: '',
      alt:  '감자쌤이 알려주는 하루 10분 현금흐름 만들기',
      newTab: false
    },
    {
      pc:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner4_pc.png',
      mo:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner4_mo.png',
      link: '',
      alt:  '퇴직 이후 연금흐름 만들기',
      newTab: false
    },
    {
      pc:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner5_pc.png',
      mo:   'https://cdn.jsdelivr.net/gh/bjssh12/imweb_site@main/main-banner/images/banner5_mo.png',
      link: '',
      alt:  '어려운 부동산 계약에 확신과 신뢰를 주는 다오 풀케어',
      newTab: false
    }
  ];

  var AUTOPLAY_MS   = 4000;  // 배너가 넘어가는 간격 (0으로 하면 자동 넘김 끔)
  var SPEED_MS      = 600;   // 넘어가는 애니메이션 속도
  var MOBILE_MAX_PX = 767;   // 이 폭 이하에서 모바일 이미지 사용

  /* =============== 여기부터는 수정하지 않아도 됩니다 =============== */

  // jQuery가 이미 있으면 그대로 쓰고, 없을 때만 불러옵니다.
  // (아임웹에는 jQuery가 기본으로 들어 있어서, 중복으로 불러오면 충돌할 수 있습니다)
  if (window.jQuery) {
    window.jQuery(document).ready(start);
  } else {
    var jq = document.createElement('script');
    jq.src = 'https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js';
    jq.onload = function () { window.jQuery(document).ready(start); };
    document.head.appendChild(jq);
  }

  function start() {
    var $ = window.jQuery;

    var $root  = $('#dbrBanner');
    var $track = $('#dbrTrack');
    var $dots  = $('#dbrDots');
    if (!$root.length || !$track.length) return;

    var total = BANNERS.length;
    if (!total) { $root.hide(); return; }

    // 첫 배너 이미지의 실제 픽셀에서 비율을 읽어 배너 높이에 반영
    function syncRatio(img) {
      if (img && img.naturalWidth && img.naturalHeight) {
        $root[0].style.setProperty('--dbr-ratio', img.naturalWidth + ' / ' + img.naturalHeight);
      }
    }

    function placeholder(index, message) {
      return $('<div class="dbr-placeholder"></div>')
        .text('배너' + (index + 1) + ' — ' + message);
    }

    function buildSlide(item, index, isClone) {
      var $slide = item.link
        ? $('<a class="dbr-slide"></a>').attr('href', item.link)
        : $('<div class="dbr-slide"></div>');

      if (item.link && item.newTab) $slide.attr({ target: '_blank', rel: 'noopener' });
      if (isClone) $slide.attr('aria-hidden', 'true');

      if (!item.pc && !item.mo) {
        return $slide.append(placeholder(index, '이미지 주소를 넣어주세요'));
      }

      var $picture = $('<picture></picture>');
      if (item.pc && item.mo) {
        $picture.append(
          $('<source>').attr({ media: '(max-width: ' + MOBILE_MAX_PX + 'px)', srcset: item.mo })
        );
      }

      var $img = $('<img>')
        .attr('alt', isClone ? '' : (item.alt || ''))
        .attr('decoding', 'async')
        .prop('draggable', false);

      if (index === 0 && !isClone) {
        $img.attr('fetchpriority', 'high');
        // 화면 폭이 바뀌어 PC↔모바일 이미지가 교체될 때마다 비율 재계산
        $img.on('load', function () { syncRatio(this); });
      }
      // 주소가 틀렸을 때 깨진 이미지 아이콘 대신 안내 문구 표시
      $img.on('error', function () {
        $picture.remove();
        $slide.append(placeholder(index, '이미지를 못 찾았어요. 주소를 확인해주세요'));
      });

      $img.attr('src', item.pc || item.mo);
      return $slide.append($picture.append($img));
    }

    $.each(BANNERS, function (i, item) { $track.append(buildSlide(item, i, false)); });
    if (total > 1) $track.append(buildSlide(BANNERS[0], 0, true)); // 무한 롤링용 복제

    if (total > 1) {
      $.each(BANNERS, function (i) {
        $('<button type="button" class="dbr-dot"></button>')
          .toggleClass('is-active', i === 0)
          .attr('aria-label', (i + 1) + '번째 배너로 이동')
          .on('click', function () { goTo(i); play(); })
          .appendTo($dots);
      });
    } else {
      $dots.hide();
    }

    var index = 0, locked = false, timer = null;

    function setTransform(withAnim) {
      $track.css({
        transition: withAnim ? 'transform ' + SPEED_MS + 'ms cubic-bezier(.4,0,.2,1)' : 'none',
        transform: 'translate3d(' + (-index * 100) + '%,0,0)'
      });
    }

    function syncDots() {
      var real = index % total;
      $dots.children('.dbr-dot').each(function (i) {
        $(this).toggleClass('is-active', i === real);
      });
    }

    function goTo(nextIndex) {
      if (locked || total < 2) return;
      locked = true;
      index = nextIndex;
      setTransform(true);
      syncDots();
      window.setTimeout(function () {
        if (index === total) {      // 복제본에 도착 → 애니메이션 없이 첫 장으로 되돌림
          index = 0;
          setTransform(false);
        }
        locked = false;
      }, SPEED_MS);
    }

    function next() { goTo(index + 1); }

    function prev() {
      if (locked || total < 2) return;
      if (index === 0) {            // 첫 장에서 뒤로 → 복제본으로 순간이동 후 애니메이션
        index = total;
        setTransform(false);
        void $track[0].offsetHeight; // 강제 리플로우
      }
      goTo(index - 1);
    }

    function play() {
      stop();
      if (!AUTOPLAY_MS || total < 2) return;
      timer = window.setInterval(next, AUTOPLAY_MS);
    }
    function stop() { if (timer) { window.clearInterval(timer); timer = null; } }

    $root.find('.dbr-arrow--next').on('click', function () { next(); play(); });
    $root.find('.dbr-arrow--prev').on('click', function () { prev(); play(); });

    $root.on('mouseenter', stop).on('mouseleave', play);
    $(document).on('visibilitychange', function () { document.hidden ? stop() : play(); });

    // 모바일 스와이프
    var startX = 0, startY = 0, dragging = false;
    $root.on('touchstart', function (e) {
      var t = e.originalEvent.touches[0];
      startX = t.clientX; startY = t.clientY; dragging = true; stop();
    });
    $root.on('touchend', function (e) {
      if (!dragging) return;
      dragging = false;
      var t  = e.originalEvent.changedTouches[0];
      var dx = t.clientX - startX;
      var dy = t.clientY - startY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
      play();
    });

    setTransform(false);
    play();
  }
})();
</script>
