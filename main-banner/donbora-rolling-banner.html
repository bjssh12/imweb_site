     돈보라 메인 롤링 배너
     이 파일 전체를 복사해서 아임웹 > 코드(HTML) 위젯에 붙여넣으세요.

     =================================================================== -->

<style>
/* -------- 배너 틀 -------- */
#dbrBanner {
  --dbr-ratio: 1920 / 460;   /* 배경 이미지 비율 */
  --dbr-radius: 0px;
  --dbr-maxwidth: none;

  position: relative;
  width: 100%;
  max-width: var(--dbr-maxwidth);
  margin: 0 auto;
  overflow: hidden;
  border-radius: var(--dbr-radius);

  font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
               system-ui, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
  word-break: keep-all;
}
#dbrBanner * { box-sizing: border-box; font-family: inherit; }

#dbrBanner .dbr-viewport {
  position: relative; width: 100%;
  aspect-ratio: var(--dbr-ratio);
  overflow: hidden; background: #f1f3f5;
}
#dbrBanner .dbr-track { display: flex; width: 100%; height: 100%; will-change: transform; }
#dbrBanner .dbr-slide {
  flex: 0 0 100%; width: 100%; height: 100%;
  display: block; position: relative; overflow: hidden;
  text-decoration: none; -webkit-tap-highlight-color: transparent;
  container-type: inline-size;   /* 글씨가 배너 폭에 비례해 커지고 작아지도록 */
}
#dbrBanner .dbr-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%; object-fit: cover; object-position: center;
  display: block; user-select: none; -webkit-user-drag: none;
}

/* -------- 글씨 공통 --------
   좌표(left/top)는 1920x460 디자인 기준 백분율,
   글자 크기는 cqw(배너 폭의 1%) 단위라 화면이 줄어도 배경과 같은 비율로 줄어듭니다. */
#dbrBanner .dbr-copy {
  position: absolute; z-index: 2; margin: 0;
  letter-spacing: -0.104cqw;
  white-space: nowrap;
}
#dbrBanner .dbr-copy p { margin: 0; }
#dbrBanner .dbr-copy b { font-weight: 800; }

/* -------- 형광펜 하이라이트 --------
   글자에 배경으로 붙기 때문에 문구를 고쳐도 하이라이트가 알아서 따라옵니다. */

  padding: 0.05cqw 0.26cqw;
  margin-left: -0.26cqw;

}
#dbrBanner .hl-skew { position: relative; isolation: isolate; padding: 0 0.4cqw; }
#dbrBanner .hl-skew::before {

  left: -0.55cqw; right: -1.0cqw; top: -0.1cqw; bottom: -0.1cqw;

/* -------- 화살표 -------- */
#dbrBanner .dbr-arrow {

/* -------- 도트 -------- */
#dbrBanner .dbr-dots {
  position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
  display: flex; align-items: center; gap: 8px; z-index: 3;

}
#dbrBanner .dbr-dot {
  width: 8px; height: 8px; padding: 0; border: 0; border-radius: 50%; cursor: pointer;

#dbrBanner .dbr-dot.is-active { width: 20px; border-radius: 999px; background: #fff; }

@media (max-width: 767px) {

}
@media (prefers-reduced-motion: reduce) {
  #dbrBanner .dbr-track { transition: none !important; }

<!-- ======================= jQuery + JavaScript ======================= -->
<script>
(function () {
  var AUTOPLAY_MS = 4000;  // 배너가 넘어가는 간격 (0으로 하면 자동 넘김 끔)
  var SPEED_MS    = 600;   // 넘어가는 애니메이션 속도

  /* =============== 여기부터는 수정하지 않아도 됩니다 =============== */

  // 아임웹에는 jQuery가 이미 있으므로, 없을 때만 불러옵니다.
  if (window.jQuery) {
    window.jQuery(document).ready(start);
  } else {
    var jq = document.createElement('script');
    jq.src = 'https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js';
    jq.onload = function () { window.jQuery(document).ready(start); };
    document.head.appendChild(jq);
  }

  function start() {
    var $ = window.jQuery;

    var $root  = $('#dbrBanner');
    var $track = $('#dbrTrack');
    var $dots  = $('#dbrDots');
    if (!$root.length || !$track.length) return;

    var $slides = $track.children('.dbr-slide');
    var total = $slides.length;
    if (!total) { $root.hide(); return; }

    // 링크가 비어 있으면 클릭돼도 아무 일 없도록 하고, 설명문은 접근성 라벨로
    $slides.each(function () {
      var $s = $(this);
      if (!$s.attr('href')) $s.removeAttr('href');
      var alt = $s.data('alt');
      if (alt) $s.attr('aria-label', alt);
    });

    // 배경 이미지의 실제 비율로 배너 높이를 맞춤
    function syncRatio(img) {
      if (img && img.naturalWidth && img.naturalHeight) {
        $root[0].style.setProperty('--dbr-ratio', img.naturalWidth + ' / ' + img.naturalHeight);
      }
    }
    var firstImg = $slides.eq(0).find('.dbr-bg')[0];
    if (firstImg) {
      $(firstImg).on('load', function () { syncRatio(this); });
      if (firstImg.complete) syncRatio(firstImg);
    }

    // 무한 롤링용으로 첫 장을 맨 뒤에 복제
    if (total > 1) {
      $track.append($slides.eq(0).clone().attr('aria-hidden', 'true').removeAttr('href'));
    }

    if (total > 1) {
      for (var i = 0; i < total; i++) {
        (function (idx) {
          $('<button type="button" class="dbr-dot"></button>')
            .toggleClass('is-active', idx === 0)
            .attr('aria-label', (idx + 1) + '번째 배너로 이동')
            .on('click', function (e) { e.preventDefault(); goTo(idx); play(); })
            .appendTo($dots);
        })(i);
      }
    } else {
      $dots.hide();
    }

    var index = 0, locked = false, timer = null;

    function setTransform(withAnim) {
      $track.css({
        transition: withAnim ? 'transform ' + SPEED_MS + 'ms cubic-bezier(.4,0,.2,1)' : 'none',
        transform: 'translate3d(' + (-index * 100) + '%,0,0)'
      });
    }

    function syncDots() {
      var real = index % total;
      $dots.children('.dbr-dot').each(function (i) { $(this).toggleClass('is-active', i === real); });
    }

    function goTo(nextIndex) {
      if (locked || total < 2) return;
      locked = true;
      index = nextIndex;
      setTransform(true);
      syncDots();
      window.setTimeout(function () {
        if (index === total) { index = 0; setTransform(false); }   // 복제본 → 첫 장으로 순간 복귀
        locked = false;
      }, SPEED_MS);
    }

    function next() { goTo(index + 1); }

    function prev() {
      if (locked || total < 2) return;
      if (index === 0) { index = total; setTransform(false); void $track[0].offsetHeight; }
      goTo(index - 1);
    }

    function play() { stop(); if (AUTOPLAY_MS && total > 1) timer = window.setInterval(next, AUTOPLAY_MS); }
    function stop() { if (timer) { window.clearInterval(timer); timer = null; } }

    $root.find('.dbr-arrow--next').on('click', function (e) { e.preventDefault(); next(); play(); });
    $root.find('.dbr-arrow--prev').on('click', function (e) { e.preventDefault(); prev(); play(); });

    $root.on('mouseenter', stop).on('mouseleave', play);
    $(document).on('visibilitychange', function () { document.hidden ? stop() : play(); });

    // 모바일 스와이프
    var startX = 0, startY = 0, dragging = false;
    $root.on('touchstart', function (e) {
      var t = e.originalEvent.touches[0];
      startX = t.clientX; startY = t.clientY; dragging = true; stop();
    });
    $root.on('touchend', function (e) {
      if (!dragging) return;
      dragging = false;
      var t = e.originalEvent.changedTouches[0];
      var dx = t.clientX - startX, dy = t.clientY - startY;
      if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) { dx < 0 ? next() : prev(); }
      play();
    });

    setTransform(false);
    play();
  }
})();
</script>
